name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # Weekly security audit run on Monday
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Fast Verification
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust Clippy check
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust workspace tests
        run: cargo test --workspace --locked

      - name: UI Typecheck
        run: npm run typecheck

      - name: UI Unit tests
        run: npm run test:unit

      - name: UI Production Build
        run: npm run build:ui

      - name: Doctor check
        run: cargo xtask doctor

  security-audit:
    name: Dependency Security Audit
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit npm production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Rust Security Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build & Package Release
    needs: [verify, security-audit]
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Release Bundle & Stage Artifacts
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File .\scripts\package.ps1

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-explorer-windows-x64
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Metadata
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          $isTag = "${{ github.ref_type }}" -eq "tag" -and $refName -like "v*"

          if ($isTag) {
              $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
              if ($refName -ne "v$version") {
                  Write-Error "Tag $refName does not match package.json version $version"
                  exit 1
              }
              $tag = $refName
              $title = "Rust Explorer $refName"
              $pre = "false"
          } else {
              $tag = "latest"
              $title = "Rust Explorer (Latest Build)"
              $pre = "true"
          }

          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TITLE=$title" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "IS_PRERELEASE=$pre" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Configured Release: Tag=$tag, Title=$title, Prerelease=$pre"

      - name: Move rolling 'latest' tag to this commit
        if: github.event_name != 'pull_request' && env.TAG_NAME == 'latest'
        shell: pwsh
        run: |
          git tag -f latest ${{ github.sha }}
          git push -f origin refs/tags/latest

      - name: Publish to GitHub Releases Tab
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_TITLE }}
          target_commitish: ${{ github.sha }}
          files: target/release-artifacts/*
          generate_release_notes: true
          make_latest: ${{ env.TAG_NAME != 'latest' }}
          draft: false
          prerelease: ${{ env.IS_PRERELEASE == 'true' }}