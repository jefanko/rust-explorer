name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 4 * * 1' # Weekly security audit run on Monday
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  verify:
    name: Fast Verification
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust Clippy check
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust workspace tests
        run: cargo test --workspace --locked

      - name: UI Typecheck
        run: npm run typecheck

      - name: UI Unit tests
        run: npm run test:unit

      - name: UI Production Build
        run: npm run build:ui

      - name: Doctor check
        run: cargo xtask doctor

  security-audit:
    name: Dependency Security Audit
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Audit npm production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Rust Security Audit
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2024-0384

  build-release:
    name: Build & Package Release
    needs: [verify]
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Build Native Win32 Release & Stage Artifacts
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: powershell -ExecutionPolicy Bypass -File .\scripts\package.ps1

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rust-explorer-windows-x64
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Metadata
        id: release_meta
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $refName = "${{ github.ref_name }}"
          $isTag = "${{ github.ref_type }}" -eq "tag" -and $refName -like "v*"
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version

          if ($isTag) {
              if ($refName -ne "v$version") {
                  Write-Error "Tag $refName does not match package.json version $version"
                  exit 1
              }
              $tag = $refName
              $title = "Rust Explorer $refName"
          } else {
              $tag = "latest"
              $title = "Rust Explorer v$version"
          }

          "tag_name=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Configured Release: Tag=$tag, Title=$title, IsTag=$isTag"

      - name: Move rolling 'latest' tag to this commit
        if: github.event_name != 'pull_request' && steps.release_meta.outputs.tag_name == 'latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          try {
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git tag -f latest ${{ github.sha }}
              git push -f "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" refs/tags/latest
          } catch {
              Write-Warning "Non-fatal: could not update rolling tag directly via git push: $_"
          }

      - name: Publish to GitHub Releases Tab
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.release_meta.outputs.tag_name }}
          name: ${{ steps.release_meta.outputs.release_title }}
          target_commitish: ${{ github.sha }}
          files: target/release-artifacts/*
          generate_release_notes: true
          make_latest: true
          draft: false
          prerelease: false
