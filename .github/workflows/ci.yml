name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Fast Verification
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust Clippy check
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust workspace tests
        run: cargo test --workspace --locked

      - name: UI Typecheck
        run: npm run typecheck

      - name: UI Unit tests
        run: npm run test:unit

      - name: UI Production Build
        run: npm run build:ui

      - name: Doctor check
        run: cargo xtask doctor

  build-release:
    name: Build & Package Release
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Release Bundle & Stage Artifacts
        run: powershell -ExecutionPolicy Bypass -File .\scripts\package.ps1

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-explorer-windows-x64
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Determine Release Metadata
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $eventName = "${{ github.event_name }}"
          $refName = "${{ github.ref_name }}"
          $releaseTag = "${{ github.event.release.tag_name }}"
          $releaseTitle = "${{ github.event.release.name }}"

          if ($eventName -eq "release" -and $releaseTag) {
              $tag = $releaseTag
              $title = if ($releaseTitle) { $releaseTitle } else { $releaseTag }
          } elseif ($refName -like "v*") {
              $tag = $refName
              $title = "Rust Explorer $refName"
          } else {
              $tag = "latest"
              $title = "Rust Explorer (Latest Build)"
          }

          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TITLE=$title" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Configured Release: Tag=$tag, Title=$title"

      - name: Publish to GitHub Releases Tab
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_TITLE }}
          target_commitish: ${{ github.sha }}
          files: target/release-artifacts/*
          generate_release_notes: true
          make_latest: "true"
          draft: false
          prerelease: false
