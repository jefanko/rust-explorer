name: CI/CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Fast Verification
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Rust format check
        run: cargo fmt --all -- --check

      - name: Rust Clippy check
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust workspace tests
        run: cargo test --workspace --locked

      - name: UI Typecheck
        run: npm run typecheck

      - name: UI Unit tests
        run: npm run test:unit

      - name: UI Production Build
        run: npm run build:ui

      - name: Doctor check
        run: cargo xtask doctor

  build-release:
    name: Build & Package Release
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri Release Bundle & Stage Artifacts
        run: powershell -ExecutionPolicy Bypass -File .\scripts\package.ps1

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-explorer-windows-x64
          path: target/release-artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
