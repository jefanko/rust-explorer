[package]
name = "rust-explorer"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
explorer-domain = { workspace = true }
explorer-win = { workspace = true }
explorer-fs = { workspace = true }
explorer-jobs = { workspace = true }
explorer-index = { workspace = true }
explorer-watch = { workspace = true }
explorer-store = { workspace = true }
explorer-app = { workspace = true }

tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
windows-core = "0.58"
windows = { workspace = true, features = [
    "implement",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Controls",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Imaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_System_DataExchange",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_Time",
] }

[dev-dependencies]
tempfile = { workspace = true }
